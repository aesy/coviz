<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Coviz: coverage reports you can read and share</title>
    <meta
      name="description"
      content="Coviz turns LCOV, JaCoCo, Cobertura and LLVM JSON coverage reports into one self-contained HTML page."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coviz" />
    <meta property="og:title" content="Coviz: coverage reports you can read and share" />
    <meta
      property="og:description"
      content="Coviz turns LCOV, JaCoCo, Cobertura and LLVM JSON coverage reports into one self-contained HTML page."
    />
    <script>
      // Sets the color scheme before first paint, so dark mode does not flash light.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('mantine-color-scheme-value');
        } catch (_) {}
        var scheme = stored === 'light' || stored === 'dark' ? stored : null;
        if (!scheme) {
          scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

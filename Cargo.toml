[workspace]
resolver = "3"
members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = "4.6.9"
json_comments = "0.2.2"
minijinja = "3.1.0"
opener = "0.9.0"
quick-xml = "0.42.0"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1

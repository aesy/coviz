[package]
name = "coviz"
version = "0.1.0"
edition = "2024"
description = "Code coverage report visualizer"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
minijinja = { version = "2.24.0", features = ["custom_syntax"] }
opener = "0.8.5"
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

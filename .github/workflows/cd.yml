---
name: Continuous Deployment

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  upload-artifact:
    name: Upload ${{ matrix.target }} artifact
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            path: ./target/x86_64-unknown-linux-musl/release/coviz
            name: coviz-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            path: ./target/aarch64-unknown-linux-musl/release/coviz
            name: coviz-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            path: ./target/aarch64-apple-darwin/release/coviz
            name: coviz-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            path: ./target/x86_64-pc-windows-msvc/release/coviz.exe
            name: coviz-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build project
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        shell: bash
        run: cp "${{ matrix.path }}" "${{ matrix.name }}"
      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: upload-artifact
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --package coviz-cli --token ${{ secrets.CARGO_TOKEN }}
